name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON schemas
        run: |
          python -m json.tool references/output-schema.json
          python -m json.tool references/machine-error-schema.json
          python -m json.tool references/ap-content-boundaries.json

      - name: Validate behavior eval corpus
        run: python scripts/run_behavior_evals.py

      - name: Validate UTF-8 CLI
        run: python -X utf8 scripts/validate_topic_code.py --course calc-ab --evidence-json "Ｕｎｉｔ　３，　Ｔｏｐｉｃ　３．１　—　Ｔｈｅ　Ｃｈａｉｎ　Ｒｕｌｅ"
